<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliance Power-Ups Console</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background: #1a1a1a; color: #ffffff; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .picker-container, .console-container { width: 100%; max-width: 450px; background: #252525; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        h2, h3 { margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .color-btn { width: 100%; padding: 15px; font-size: 18px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .powerup-item { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 12px; border-left: 5px solid #ffc107; text-align: left; }
        .powerup-name { font-size: 16px; font-weight: bold; display: block; }
        .powerup-count { font-size: 12px; color: #888; }
        .btn-activate { padding: 10px 20px; font-size: 14px; font-weight: bold; background: #ffc107; color: #000; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
        .btn-activate:disabled { background: #444 !important; color: #777 !important; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- STAGE 1: ALLIANCE SELECTOR FOR THE POWERUP PAGE -->
    <div id="powerup-setup" class="picker-container">
        <h2>Select Your Alliance</h2>
        <button class="color-btn" style="background:#dc3545" onclick="setPowerUpAlliance('Red')">Red Alliance</button>
        <button class="color-btn" style="background:#007bff" onclick="setPowerUpAlliance('Blue')">Blue Alliance</button>
        <button class="color-btn" style="background:#ffc107; color:black" onclick="setPowerUpAlliance('Yellow')">Yellow Alliance</button>
        <button class="color-btn" style="background:#28a745" onclick="setPowerUpAlliance('Green')">Green Alliance</button>
    </div>

    <!-- STAGE 2: LIVE DEPLOYMENT DASHBOARD -->
    <div id="powerup-console" class="console-container" style="display: none;">
        <h3 id="console-banner" style="padding: 10px; border-radius: 6px;">Power-Ups</h3>
        <div id="powerups-available-list">
            <!-- Dynamic Injection Rows -->
            <p id="empty-msg" style="color:#666; font-size:14px; padding:20px;">No power-ups configured.</p>
        </div>
    </div>

    <script src="./powerup.js"></script>
</body>
</html>
