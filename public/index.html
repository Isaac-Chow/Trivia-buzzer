<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliance Game Show</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <div id="countdown-banner">Time Remaining: <span id="countdown-number">3</span>s</div>

    <!-- INITIAL ALLIANCE PICKER -->
    <div id="setup-screen" class="alliance-picker">
        <h2>Choose Your Alliance</h2>
        <button class="color-btn" style="background:#dc3545" onclick="selectAlliance('Red')">Red Alliance</button>
        <button class="color-btn" style="background:#007bff" onclick="selectAlliance('Blue')">Blue Alliance</button>
        <button class="color-btn" style="background:#ffc107; color:black" onclick="selectAlliance('Yellow')">Yellow Alliance</button>
        <button class="color-btn" style="background:#28a745" onclick="selectAlliance('Green')">Green Alliance</button>
    </div>

    <!-- PARTICIPANTS PANEL -->
    <div id="participant-ui" class="layout-wrapper container">
        <div class="main-panel">
            <h1 id="alliance-banner" style="padding: 12px; border-radius: 8px; margin-bottom: 15px;">Your Screen</h1>
            <h3 id="status-text" style="color: #aaaaaa; font-weight: normal;">Waiting for host...</h3>
            <div class="grid-2x2">
                <button class="btn option-btn" data-opt="A" onclick="toggleOption('A')" disabled>A</button>
                <button class="btn option-btn" data-opt="B" onclick="toggleOption('B')" disabled>B</button>
                <button class="btn option-btn" data-opt="C" onclick="toggleOption('C')" disabled>C</button>
                <button class="btn option-btn" data-opt="D" onclick="toggleOption('D')" disabled>D</button>
            </div>
            <button id="submit-action-btn" class="btn-submit" onclick="submitAnswer()" disabled>None of the above</button>
        </div>
        <div class="sidebar">
            <h3 style="text-align: left; margin-bottom: 10px;">Alliance Scores</h3>
            <div id="participant-scores"></div>
        </div>
    </div>

    <!-- HOST CONFIGURATION DASHBOARD -->
    <div id="host-ui" class="container" style="max-width: 850px;">
        <h1>Host Control Dashboard</h1>
        
        <div class="settings-card">
            <strong>Game Point Grid Matrix Configurations</strong>
            <div class="settings-grid">
                <div class="setting-field"><label>Correct</label><input type="number" id="rule-correct" value="1" oninput="recalculateScores()"></div>
                <div class="setting-field"><label>First + Correct</label><input type="number" id="rule-first" value="2" oninput="recalculateScores()"></div>
                <div class="setting-field"><label>Incorrect</label><input type="number" id="rule-incorrect" value="0" oninput="recalculateScores()"></div>
                <div class="setting-field"><label>No Answer</label><input type="number" id="rule-noanswer" value="0" oninput="recalculateScores()"></div>
            </div>
        </div>

        <!-- TWO-TIER RUNTIME HOST CONTROLS -->
        <div style="margin-bottom: 25px;">
            <!-- Tier 1: Master Control Fallbacks -->
            <div class="host-controls" style="margin-bottom: 10px;">
                <button class="btn-host" style="background:#28a745; color:white;" onclick="startRound()">▶ Start</button>
                <button class="btn-host" style="background:#ffc107; color:black;" onclick="triggerCountdown()">⏳ Countdown</button>
                <button class="btn-host" style="background:#dc3545; color:white;" onclick="stopRound()">⏹ Stop</button>
            </div>
            <!-- Tier 2: Automated Workflow Driver -->
            <button id="host-state-btn" class="btn-host" style="background:#28a745; color:white; width:100%; padding:18px;" onclick="handleSmartButtonClick()">▶ Start Round</button>
        </div>

        <div style="background:#222; padding:10px; border-radius:8px; margin-bottom:20px;">
            <p style="text-align:center; font-size:14px; color:#aaa;">Input Question Model Answer Key:</p>
            <div class="host-answer-matrix">
                <label class="matrix-label"><input type="checkbox" class="matrix-box" value="A" onchange="modelAnswerChanged()"> A</label>
                <label class="matrix-label"><input type="checkbox" class="matrix-box" value="B" onchange="modelAnswerChanged()"> B</label>
                <label class="matrix-label"><input type="checkbox" class="matrix-box" value="C" onchange="modelAnswerChanged()"> C</label>
                <label class="matrix-label"><input type="checkbox" class="matrix-box" value="D" onchange="modelAnswerChanged()"> D</label>
            </div>
        </div>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 25px;">
            <div>
                <h3 style="text-align: left;">Submission Queue (Fastest First)</h3>
                <div id="submission-queue" style="margin-top:10px;"></div>
            </div>
            <div>
                <h3 style="text-align: left;">Score Adjustment</h3>
                <div id="host-score-modifiers" style="margin-top:10px;"></div>
                <button class="btn-submit" style="margin-top:15px; padding:12px; font-size:16px; background:#495057;" onclick="saveScores()">Sync Manual Inputs</button>
            </div>
        </div>
    </div>

    <script src="./client.js"></script>
</body>
</html>
